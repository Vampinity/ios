name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore LFS image assets
        run: |
          git lfs install
          git remote add upstream https://github.com/sleepypod/ios.git || true
          git lfs fetch upstream || true
          git lfs checkout || true
          # any PNG still an LFS pointer gets a generated placeholder so
          # the asset catalog can compile (forks do not inherit LFS objects)
          for f in $(git ls-files '*.png'); do
            if head -c 40 "$f" | grep -q "git-lfs.github.com"; then
              echo "placeholder: $f"
              python3 - "$f" <<'PY'
          import sys, zlib, struct
          path = sys.argv[1]
          w = h = 1024
          rows = b''.join(b'\x00' + bytes([26, 42, 74, 255]) * w for _ in range(h))
          def chunk(tag, data):
              body = tag + data
              return struct.pack('>I', len(data)) + body + struct.pack('>I', zlib.crc32(body) & 0xffffffff)
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(rows, 6))
                 + chunk(b'IEND', b''))
          open(path, 'wb').write(png)
          PY
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install npm deps
        run: npm ci || npm install

      - name: Strip HealthKit entitlement
        run: |
          cat > Sleepypod/Sleepypod.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          PLIST
          sed -i '' \
            -e '/^      properties:$/d' \
            -e '/com.apple.developer.healthkit/d' \
            -e '/- health-records/d' \
            project.yml
          cat project.yml

      - name: Generate project
        run: xcodegen generate

      - name: Archive unsigned
        run: |
          xcodebuild archive \
            -project Sleepypod.xcodeproj \
            -scheme Sleepypod \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Sleepypod.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" CODE_SIGN_STYLE=Manual

      - name: Package IPA
        id: pkg
        run: |
          APP=build/Sleepypod.xcarchive/Products/Applications/Sleepypod.app
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          rm -rf build/Payload/Sleepypod.app/_CodeSignature
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
                build/Payload/Sleepypod.app/Info.plist)
          (cd build && zip -qry "Sleepypod-unsigned.ipa" Payload)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "size=$(stat -f%z build/Sleepypod-unsigned.ipa)" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          files: build/Sleepypod-unsigned.ipa

      - name: Regenerate source.json
        run: |
          cat > source.json <<EOF
          {
            "name": "Sleepypod",
            "identifier": "com.jonathanng.ios.sleepypod.source",
            "subtitle": "Local control for Eight Sleep Pod",
            "apps": [
              {
                "name": "Sleepypod",
                "bundleIdentifier": "com.jonathanng.ios.sleepypod",
                "developerName": "sleepypod",
                "localizedDescription": "Temperature control, sleep tracking and biometrics for a self-hosted Eight Sleep Pod.",
                "versions": [
                  {
                    "version": "${{ steps.pkg.outputs.version }}",
                    "buildVersion": "1",
                    "date": "$(date -u +%Y-%m-%d)",
                    "localizedDescription": "Self-built IPA, signed locally.",
                    "downloadURL": "https://github.com/${{ github.repository }}/releases/download/${{ steps.pkg.outputs.tag }}/Sleepypod-unsigned.ipa",
                    "size": ${{ steps.pkg.outputs.size }},
                    "minOSVersion": "26.0"
                  }
                ]
              }
            ]
          }
          EOF
          cat source.json

      - name: Commit source.json
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -- . || true
          git fetch origin dev
          git checkout dev
          git add source.json
          git diff --staged --quiet || git commit -m "chore: update source.json [skip ci]"
          git push origin dev
